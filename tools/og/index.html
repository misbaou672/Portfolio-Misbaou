<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Carte de partage</title>
    <script type="module">
      import '/src/styles/fonts.css';
      import '/src/styles/tokens.css';
    </script>
    <style>
      /* Le gabarit fait exactement 1200 x 630, la taille attendue par
         Open Graph et Twitter. Le rendu est capture a l'echelle 1. */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .carte {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        box-sizing: border-box;
        padding: 78px 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      /* Halo violet en haut a droite, comme sur le hub. */
      .carte::before {
        content: '';
        position: absolute;
        inset: -20% -30% auto auto;
        width: 900px;
        height: 900px;
        background: radial-gradient(closest-side, var(--violet-pale), transparent 72%);
        opacity: 0.85;
      }
      /* Trame millimetree, tres pale : elle donne le grain du site. */
      .carte::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 60px),
          repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 60px);
        opacity: 0.55;
      }
      .cadre {
        position: absolute;
        inset: 34px;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .contenu {
        position: relative;
        z-index: 1;
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 26px;
        font-family: var(--font-mono);
        font-size: 18px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--violet-sub);
      }
      .kicker::before {
        content: '';
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--violet);
      }
      /* Meme reglage que `.title` du hub : le gabarit avait derive vers un
         poids 400 et un interlettrage positif, la ou le site affiche le nom en
         800 resserre. Une carte de partage doit ressembler a la page. */
      .nom {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 128px;
        line-height: 0.88;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .nom span {
        display: block;
      }
      /* `--violet` a disparu des jetons quand la palette est passee au cyan :
         l'accent etait sans effet, les deux lignes du nom sortaient de la
         meme couleur. */
      .nom .accent {
        color: var(--cyan);
      }
      .accroche {
        margin: 40px 0 0;
        max-width: 800px;
        font-size: 27px;
        line-height: 1.42;
        color: var(--ink-muted);
        /* Sans equilibrage, la derniere ligne se reduisait a deux mots
           orphelins sous un pave pleine largeur. */
        text-wrap: balance;
      }
      .signature {
        position: absolute;
        right: 96px;
        bottom: 86px;
        z-index: 1;
        font-family: var(--font-mono);
        font-size: 17px;
        letter-spacing: 0.2em;
        color: var(--ink-faint);
      }
    </style>
  </head>
  <body>
    <div class="carte">
      <div class="cadre"></div>
      <div class="contenu">
        <p class="kicker">Portfolio &middot; Alternance 2026</p>
        <h1 class="nom">
          <span>Misbaou</span>
          <span class="accent">Diallo</span>
        </h1>
        <p class="accroche">
          Développeur back-end &amp; automatisation. Je développe des applications web et
          j'automatise des tâches, cap sur le DevOps et le DevSecOps.
        </p>
      </div>
      <p class="signature">BUT3 &middot; UPEC</p>
    </div>
  </body>
</html>
